name: iOS Unsigned IPA (Sideloadly / AltStore)

# Build un .ipa NON SIGNÉ sur runner macOS GitHub,
# prêt à être re-signé en local avec Sideloadly ou AltStore (Apple ID gratuit).
# Aucun compte Apple Developer, aucun secret requis.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prebuild iOS native project (CNG)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Detect workspace and scheme
        id: detect
        run: |
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" | grep -v Pods | head -n 1)
          echo "workspace=$WORKSPACE" >> $GITHUB_OUTPUT
          echo "Found workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE" | head -n 40
          # Premier scheme applicatif (ignore Pods)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | grep -v Pods | head -n 1 | xargs)
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Using scheme: $SCHEME"

      - name: Build .app NON SIGNÉ (iphoneos)
        run: |
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP_PATH"
          test -d "$APP_PATH" || (echo "Aucun .app trouvé" && exit 1)
          rm -rf Payload unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Retire les signatures résiduelles pour Sideloadly / AltStore
          codesign --remove-signature "Payload/$(basename "$APP_PATH")" || true
          zip -r -y unsigned.ipa Payload
          ls -lh unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: unsigned.ipa
          retention-days: 7
